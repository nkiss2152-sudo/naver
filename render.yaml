services:
  - type: web
    name: keyword-service
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: NAVER_API_KEY
        sync: false
      - key: NAVER_SECRET_KEY
        sync: false
      - key: NAVER_CUSTOMER_ID
        sync: false
      - key: CACHE_TTL
        value: "86400"
      - key: RATE_WINDOW
        value: "600"
      - key: RATE_LIMIT
        value: "20"
      - key: DAILY_UPSTREAM_CAP
        value: "3000"
      - key: PYTHON_VERSION
        value: "3.12.6"
